name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod artifact metadata
        id: mod
        shell: bash
        run: |
          mod_id=$(sed -n 's/^mod_id=//p' gradle.properties)
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          echo "name=${mod_id}-${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=build/libs/${mod_id}-${mod_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Build mod and run unit tests
        run: ./gradlew build --console=plain

      - name: Run server integration tests
        run: ./gradlew runGameTestServer --console=plain

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mod.outputs.name }}
          path: ${{ steps.mod.outputs.jar }}
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/problems/
            run/logs/
            run/crash-reports/
          if-no-files-found: ignore
